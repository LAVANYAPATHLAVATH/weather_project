<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Notifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>🌤️ Live Weather Notifier</h1>
        <p class="subtitle">Check live weather in your city</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g. Hyderabad)">
            <button id="micBtn" type="button">🎤 Speak</button>
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <section id="weatherResult" class="weather-card" hidden>
            <h2 id="cityName"></h2>
            <p id="condition"></p>
            <div class="temperature" id="temperature"></div>

            <div class="details">
                <p>Feels Like: <strong id="feelsLike"></strong></p>
                <p>Humidity: <strong id="humidity"></strong></p>
                <p>Wind Speed: <strong id="windSpeed"></strong></p>
            </div>

            <p id="suggestion"></p>
        </section>

        <footer>Powered by OpenWeatherMap</footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
